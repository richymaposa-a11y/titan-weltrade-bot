<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan Weltrade Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 14px; width: 90%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #333; }
    h2 { text-align: center; color: #00ff88; margin-bottom: 20px; font-size: 22px; }
    input, select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #252525; color: #fff; box-sizing: border-box; font-size: 15px; }
    input:focus, select:focus { outline: none; border-color: #00ff88; }
    button { background: #00ff88; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    button:active { background: #00cc6a; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; color: #aaa; line-height: 1.4; }
  </style>
</head>
<body>

<div class="card">
  <h2>Titan Weltrade Bot</h2>
  <form id="botForm">
    <input type="text" id="login" placeholder="Weltrade MT5 Account ID" required>
    <input type="password" id="password" placeholder="Weltrade MT5 Password" required>
    <input type="text" id="server" placeholder="Weltrade Server (e.g. Weltrade-Live)" value="Weltrade-Live" required>
    
    <select id="symbol">
      <option value="EURUSD">EURUSD</option>
      <option value="GBPUSD">GBPUSD</option>
      <option value="XAUUSD">Gold (XAUUSD)</option>
    </select>
    
    <input type="number" step="0.01" id="lot" placeholder="Lot Size" value="0.01">
    <button type="submit">Launch Automated Bot</button>
  </form>
  <div id="status">Panel ready. Enter account credentials.</div>
</div>

<script>
document.getElementById('botForm').onsubmit = async (e) => {
  e.preventDefault();
  document.getElementById('status').innerText = "Transmitting credentials to FxSVPS...";
  
  const payload = {
    login: document.getElementById('login').value,
    password: document.getElementById('password').value,
    server: document.getElementById('server').value,
    symbol: document.getElementById('symbol').value,
    lot: document.getElementById('lot').value
  };

  try {
    const res = await fetch('/start-bot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById('status').innerText = data.message;
  } catch (err) {
    document.getElementById('status').innerText = "Failed to communicate with server backend.";
  }
};
</script>
</body>
</html>
